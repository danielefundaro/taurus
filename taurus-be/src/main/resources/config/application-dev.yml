# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    #    tech.jhipster: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    com.fundaro.zodiac.taurus: DEBUG
    com.fundaro.zodiac.taurus.repository: INFO
    com.fundaro.zodiac.taurus.web.rest.PreferencesResource: INFO
    com.fundaro.zodiac.taurus.service.PreferencesService: INFO
#    org.apache.http.wire: DEBUG
#    org.apache.http.headers: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
  jackson:
    serialization:
      indent-output: true
  liquibase:
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: dev, faker
    url: jdbc:postgresql://localhost:5432/taurus
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/taurus
    username: taurus
    password: password
    hikari:
      poolName: Hikari
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
  thymeleaf:
    cache: false
  mail:
    # Mailpit of src/main/docker/services.yml: messages are collected and shown at http://localhost:8025.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  # CORS is only enabled by default with the "dev" profile
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    #    allow-credentials: true
    max-age: 1800
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  inventory:
    qr:
      enabled: true
      public-base-url: http://localhost:4200
  event-preparation:
    enabled: true
  score-playback:
    enabled: true
  score-writing:
    enabled: true
  omr:
    # OMR service of src/main/docker/services.yml, with the development key of its .env file.
    url: ${TAURUS_OMR_URL:http://localhost:8090}
    api-key: ${TAURUS_OMR_API_KEY:taurus-omr-development-key}
  dashboard:
    enabled: true
  signature:
    otp-secret: ${SIGNATURE_OTP_SECRET:taurus-signature-development-secret}
    # The links sent to the parents open the Angular development server.
    public-base-url: ${SIGNATURE_PUBLIC_BASE_URL:http://localhost:4200}
    seal:
      # Without a keystore, a temporary self-signed certificate seals the documents.
      ephemeral: true
    keycloak:
      # Secret of the taurus-signature client of the development realm.
      client-secret: ${SIGNATURE_KEYCLOAK_CLIENT_SECRET:taurus-signature}
