# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      access: unrestricted
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: taurus
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  jackson:
    # Jackson 3 con i default usati da Spring Boot per Jackson 2: il JSON delle API resta quello di prima,
    # con lo stesso ordine dei campi e lo stesso formato delle date.
    use-jackson2-defaults: true
  messages:
    basename: i18n/messages
  rabbitmq:
    listener:
      simple:
        # Un messaggio rifiutato finisce nella coda di scarto dichiarata da
        # DeadLetterQueueConfiguration, non di nuovo in coda: la ripresa dei job vive nel database.
        default-requeue-rejected: false
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://localhost:9080/realms/taurus
        registration:
          oidc:
            client-id: web_app
            client-secret: web_app
            scope: openid, profile, email, offline_access # last one for refresh tokens
  task:
    execution:
      thread-name-prefix: taurus-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: taurus-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'taurusApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: taurus@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Taurus API
    description: Taurus API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    oauth2:
      audience:
        - account
        - api://default
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

application:
  inventory:
    qr:
      enabled: ${INVENTORY_QR_ENABLED:false}
      public-base-url: ${INVENTORY_QR_PUBLIC_BASE_URL:https://app.example.org}
      resolution-limit-per-minute: ${INVENTORY_QR_RESOLUTION_LIMIT_PER_MINUTE:60}
      label-timeout-seconds: ${INVENTORY_QR_LABEL_TIMEOUT_SECONDS:30}
  signature:
    # Electronic signature can be enabled by a tenant only with this secret, an SMTP server (spring.mail) and a seal.
    otp-secret: ${SIGNATURE_OTP_SECRET:}
    code-validity: PT10M
    max-attempts: 5
    resend-interval: PT60S
    max-sends: 5
    max-batch-items: 50
    max-challenges-per-hour: 20
    challenge-retention-days: 30
    cleanup-cron: '0 45 3 * * *'
    # Signed acts of settled or cancelled sheets stay downloadable for these days, then they are removed.
    download-grace-days: 30
    purge-cron: '0 50 3 * * *'
    # Links to the public signature page sent to the parents without an account: built from this address only.
    public-base-url: ${SIGNATURE_PUBLIC_BASE_URL:${TAURUS_PUBLIC_BASE_URL:http://localhost:8080}}
    link-validity: P7D
    link-rate-limit-per-token-hour: 120
    link-rate-limit-per-ip-hour: 600
    link-expiry-cron: '0 20 * * * *'
    seal:
      keystore-path: ${SIGNATURE_SEAL_KEYSTORE_PATH:}
      keystore-password: ${SIGNATURE_SEAL_KEYSTORE_PASSWORD:}
      key-alias: ${SIGNATURE_SEAL_KEY_ALIAS:}
      ephemeral: false
      # Empty: seals are PAdES B-B, without a time stamp.
      tsa-url: ${SIGNATURE_SEAL_TSA_URL:}
    keycloak:
      # Codes of the authentication app, checked by the taurus-otp provider. Empty secret: the app is not offered.
      realm-uri: ${SIGNATURE_KEYCLOAK_REALM_URI:${spring.security.oauth2.client.provider.oidc.issuer-uri}}
      client-id: taurus-signature
      client-secret: ${SIGNATURE_KEYCLOAK_CLIENT_SECRET:}
      timeout: PT5S
    cie:
      # Certificates of the CIE certification authorities, comma separated. Empty: CieSign is not offered.
      trust-anchors: ${SIGNATURE_CIE_TRUST_ANCHORS:}
      revocation-timeout: PT10S
  upload:
    # A PDF upload job stuck in its current state for this long is taken as interrupted and closed
    # in error, so the user sees it and can retry it.
    recovery-enabled: ${UPLOAD_RECOVERY_ENABLED:true}
    stale-after: PT30M
    recovery-delay: PT5M
    max-recovered-per-run: 100
  event-preparation:
    enabled: false
  score-playback:
    enabled: ${SCORE_PLAYBACK_ENABLED:false}
    max-upload-bytes: 10485760
    kept-versions: 20
    cleanup-cron: '0 15 4 * * *'
    # Recognition jobs; the connection to the service is application.omr.
    omr:
      timeout: PT12M
      concurrency: 1
      stale-after: PT30M
      max-attempts: 3
  # Music writing editor, offered to the tenants with score playback. The edit lock serves the correction editor too.
  score-writing:
    enabled: ${SCORE_WRITING_ENABLED:false}
    lock-timeout: PT2M
    draft-min-interval: PT2S
  # Internal OMR service, shared by score playback and the text reading of uploaded PDFs.
  omr:
    # Empty: recognition, MIDI upload and text reading are not offered.
    url: ${TAURUS_OMR_URL:}
    # The same key of the service (TAURUS_OMR_API_KEY).
    api-key: ${TAURUS_OMR_API_KEY:}
    connect-timeout: PT5S
  pdf-processing:
    ocr:
      # Reads the scanned first page of the parts with the OMR service, to suggest their instruments.
      enabled: true
      timeout: PT2M
      min-confidence: 0.5
      pages-per-request: 8
  onboarding:
    enabled: true
    recovery-enabled: true
    worker-delay: 2000
    max-file-size: 10MB
    max-total-rows: 5000
    max-user-rows: 2000
    max-columns: 64
    max-cell-length: 10000
    max-cells: 400000
    max-issues: 10000
    max-pending-jobs-per-user: 3
    resume-after-millis: 60000
    identity-concurrency: 4
    abandoned-retention-days: 7
    source-retention-days: 30
    audit-retention-days: 365
    worker-batch-size: 5
  notification-preferences:
    enabled: true
    default-calendar-reminder-minutes: 30
    default-time-zone: Europe/Rome
    default-digest-local-time: "08:00"
    max-pause-days: 30
    min-snooze-minutes: 5
    max-snooze-days: 30
  notification-push-delivery:
    scheduler-enabled: true
    batch-size: 100
    poll-delay: 5000
    max-attempts: 8
    retry-initial-minutes: 1
    retry-max-minutes: 60
    default-expiration-hours: 24
    delivered-retention-days: 30
    skipped-retention-days: 30
    failed-retention-days: 90
  # Emergency switch of the guided tour (docs/guided-tour-spec.md).
  guided-tour:
    enabled: true
  dashboard:
    enabled: false
    calendar-look-ahead-days: 14
    inventory-expiration-look-ahead-days: 30
    inventory-warning-days: 7
    finance-unreconciled-warning-days: 30
  notifications:
    scheduler-enabled: true
    dispatch-delay: 5000
    batch-size: 100
    cleanup-cron: "0 30 3 * * *"
    outbox-retention-days: 30
    retry:
      initial-delay-minutes: 1
      max-delay-minutes: 60
      max-attempts: 0
  calendar:
    recurrence:
      max-occurrences: 500
  calendar-feed:
    enabled: ${CALENDAR_FEED_ENABLED:true}
    public-base-url: ${TAURUS_PUBLIC_BASE_URL:http://localhost:8080}
    default-past-days: 90
    default-future-months: 18
    max-components: 10000
    tombstone-retention-days: 90
    idempotency-retention-days: 30
    suggested-refresh: PT6H
    rate-limit-per-token-hour: 120
    rate-limit-per-ip-hour: ${CALENDAR_FEED_RATE_LIMIT_PER_IP_HOUR:2000}
    rate-limit-global-hour: ${CALENDAR_FEED_RATE_LIMIT_GLOBAL_HOUR:100000}
  base-path: D:\data
  keycloak:
    master-uri: http://localhost:9080/realms/master
    provision-roles: true
    admin:
      issuer-uri: http://localhost:9080/admin/realms/taurus
      username: admin
      password: admin
  vapid:
    # Generate keys with: npx web-push generate-vapid-keys
    public-key: BHEmW3uZIG2dS1KLCMqxvEnuA8lk_Tkf_gzVR9Qe7B5gsSRbrPKD903tCBiGCrVqVzfTG-zuiN6MnpN50sbAYfM
    private-key: ${VAPID_PRIVATE_KEY:CHANGE_ME}
    subject: mailto:ing.daniele.fundaro@gmail.com
  media:
    # Storage cleanup: temporary leftovers and orphan files, per tenant, every day at 03:30.
    cleanup-enabled: true
    cleanup-cron: "0 30 3 * * *"
    temporary-file-hours: 24
    orphan-file-hours: 168
    track-page-edit-receipt-days: 7
    # Rendering of a page image: beyond this the request answers 503 instead of holding the thread.
    image-edit-timeout-seconds: 30
  retention:
    # Cleanup runs every day at 03:00; override with application.retention.cleanup-cron.
    cleanup-enabled: true
    cleanup-cron: "0 0 3 * * *"
    notices-days: 365
    last-research-days: 365
    sent-push-reminders-days: 30
    tenant-indices:
      - albums
      - instruments
      - media
      - queue-upload-files
      - tracks
      - users
      - calendar-events
